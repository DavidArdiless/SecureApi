name: SecureApi Security Pipeline

on:
  push:
    branches:
      - master
      - main

  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  security:
    name: Build and Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Historia completa: un secreto borrado en un commit posterior sigue
          # estando filtrado, así que el escaneo tiene que ver todos los commits.
          fetch-depth: 0

      # Se fija la versión del escáner en lugar de usar gitleaks-action@v2.
      # El action trae un binario con un ruleset viejo y mucho más ruidoso, que
      # marcaba como filtración los valores de desarrollo commiteados a
      # propósito. Con la versión fijada el repo escanea limpio sin suprimir
      # nada, y la misma versión se puede correr local para reproducir el
      # resultado exacto:
      #   gitleaks detect --source . --config .gitleaks.toml --redact
      - name: Secret Scan (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/gitleaks"
          mkdir -p "$DIR"
          curl -sSfL -o "$DIR/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $DIR/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$DIR/gitleaks.tar.gz" -C "$DIR" gitleaks
          "$DIR/gitleaks" version
          "$DIR/gitleaks" detect --source . --config .gitleaks.toml \
            --redact --no-banner --verbose --exit-code 1

      # La solución apunta a net8.0. Instalar solo el SDK 10 hace que
      # `dotnet test` no encuentre el runtime 8 y el job falle.
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore SecureApi.sln

      - name: Build application
        run: dotnet build SecureApi.sln --no-restore --configuration Release

      - name: Run tests
        run: dotnet test SecureApi.sln --no-build --configuration Release

      # Se construye explícitamente el Dockerfile de la API. Sin -f, docker
      # tomaría el Dockerfile de la raíz y Trivy escanearía otra imagen.
      - name: Build Docker image
        run: docker build -t secure-api:${{ github.sha }} -f SecureApi/Dockerfile ./SecureApi

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'secure-api:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'
